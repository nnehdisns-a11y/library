name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            java -version
            ls "$ANDROID_HOME/platforms" || true
            ls "$ANDROID_HOME/build-tools" || true
            ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
          } 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 构建失败时把完整日志推到 ci-logs 分支，便于公开读取排错（不触发新工作流）
      - name: Publish failure log
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f build.log
          git commit -m "CI failure log ${GITHUB_SHA::7}"
          git push -f origin ci-logs
